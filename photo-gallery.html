<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影图集</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body {
    background-color: #0b101c;
    color: #c8d8f0;
    overflow-x: hidden;
}
#canvas-bg {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}
.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 40px 20px;
}
header {
    text-align: center;
    margin-bottom: 40px;
}
header h1 {
    font-size: 48px;
    margin-bottom: 12px;
    color: #74b8ff;
}
header p {
    font-size: 18px;
    color: #99b8e3;
}
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 45px;
}
nav a {
    color: #c8d8f0;
    text-decoration: none;
    font-size: 17px;
    padding: 9px 18px;
    border: 1px solid #4078b8;
    border-radius: 6px;
    transition: 0.3s;
}
nav a:hover {
    background: #204068;
    color: #74b8ff;
    border-color: #74b8ff;
}
.gallery{
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap:24px;
}
.photo-item{
  background-color: rgba(24, 32, 48, 0.65);
  border: 1px solid #366092;
  border-radius:14px;
  overflow:hidden;
  transition: 0.3s;
}
.photo-item:hover{
  border-color: #74b8ff;
  background-color: rgba(32, 44, 66, 0.75);
  transform: translateY(-3px);
}
.photo-item img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  cursor: zoom-in;
}
.photo-info{
  padding:12px 16px;
}
.photo-title{
  font-size:18px;
  font-weight:bold;
  color:#74b8ff;
  margin-bottom:6px;
}
.photo-meta{
  font-size:14px;
  color:#99b8e3;
}
footer {
    text-align: center;
    margin-top: 70px;
    color: #7896bd;
    font-size: 14px;
}
/* 图片放大弹窗 */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:8px;
}
.lightbox.show{
  display:flex;
}
.lightbox-close{
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:36px;
  cursor:pointer;
}
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="container">
    <header>
        <h1>摄影图集</h1>
        <p>光影记录</p>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="education.html">教育背景</a>
        <a href="skills.html">技能</a>
        <a href="projects.html">项目</a>
        <a href="works.html">作品</a>
        <a href="message.html">留言板</a>
        <a href="thanks.html">致谢</a>
    </nav>

    <div class="gallery">
      <div class="photo-item">
        <img src="assets/photo/photo01.jpg" alt="秋意" onclick="openLightbox(this.src)">
        <div class="photo-info">
          <div class="photo-title">秋意</div>
          <div class="photo-meta">📍浙江工商大学 | 11月11日</div>
        </div>
      </div>
    </div>

    <footer>© 2026 个人作品集</footer>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">×</span>
  <img id="light-img" src="" />
</div>

<script>
// 星空粒子连线
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let w, h;
let dots = [];
function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
class Dot{
    constructor(){
        this.x = Math.random()*w;
        this.y = Math.random()*h;
        this.r = Math.random()*1.3 + 0.4;
        this.speedX = (Math.random()-0.5)*0.25;
        this.speedY = (Math.random()-0.5)*0.25;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x<0||this.x>w) this.speedX *= -1;
        if(this.y<0||this.y>h) this.speedY *= -1;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle="#74b8ff";
        ctx.fill();
    }
}
for(let i=0;i<70;i++) dots.push(new Dot());
function line(){
    for(let i=0;i<dots.length;i++){
        for(let j=i+1;j<dots.length;j++){
            let dx = dots[i].x - dots[j].x;
            let dy = dots[i].y - dots[j].y;
            let d = Math.sqrt(dx*dx+dy*dy);
            if(d<120){
                ctx.beginPath();
                ctx.moveTo(dots[i].x,dots[i].y);
                ctx.lineTo(dots[j].x,dots[j].y);
                ctx.strokeStyle="rgba(116,184,255,"+(1-d/120)*0.45+")";
                ctx.lineWidth=0.4;
                ctx.stroke();
            }
        }
    }
}
function animate(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{d.update();d.draw();});
    line();
    requestAnimationFrame(animate);
}
animate();

// 图片放大弹窗
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('light-img');
function openLightbox(src){
  lbImg.src = src;
  lb.classList.add('show');
}
function closeLightbox(){
  lb.classList.remove('show');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body {
    background-color: #f4f8fc;
    color: #222;
    overflow-x: hidden;
}
#canvas-bg {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}
.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 40px;
}
header {
    text-align: center;
    margin-bottom: 40px;
}
header h1 {
    font-size: 42px;
    margin-bottom: 12px;
    color: #428bca;
}
header p {
    font-size: 18px;
    color: #6688aa;
}
nav {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 40px;
}
nav a {
    color: #336699;
    text-decoration: none;
    font-size: 17px;
    padding: 8px 16px;
    border: 1px solid #72b8ff;
    border-radius: 6px;
    transition: 0.3s;
}
nav a:hover {
    background: #72b8ff;
    color: #fff;
}
/* 摄影画廊 */
.gallery{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap:24px;
  padding:20px;
}
.photo-item{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000018;
}
.photo-item img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}
.photo-item p{
  text-align:center;
  padding:10px;
  margin:0;
  color:#444;
}
footer {
    text-align: center;
    margin-top: 60px;
    color: #667788;
    font-size: 14px;
}
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="container">
    <header>
        <h1>作品</h1>
        <p>我的摄影作品</p>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="education.html">教育背景</a>
        <a href="skills.html">技能</a>
        <a href="projects.html">项目</a>
        <a href="works.html">作品</a>
        <a href="message.html">留言板</a>
        <a href="thanks.html">致谢</a>
    </nav>

    <!-- ========== 这里是画廊，在这里修改图片 ========== -->
    <div class="gallery">
      <div class="photo-item">
        <img src="assets/photo/photo01.jpg" alt="摄影作品1">
        <p>作品标题，可以写拍摄地点/时间</p>
      </div>
      <div class="photo-item">
        <img src="assets/photo/photo02.jpg" alt="摄影作品2">
        <p>作品标题</p>
      </div>
      <div class="photo-item">
        <img src="assets/photo/photo03.jpg" alt="摄影作品3">
        <p>作品标题</p>
      </div>
    </div>
    <!-- ========== 画廊结束 ========== -->

    <footer>© 2026 个人作品集</footer>
</div>

<script>
//粒子背景
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let w, h;
let dots = [];
function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
class Dot{
    constructor(){
        this.x = Math.random()*w;
        this.y = Math.random()*h;
        this.r = Math.random()*1.5 + 0.5;
        this.speedX = (Math.random()-0.5)*0.4;
        this.speedY = (Math.random()-0.5)*0.4;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x<0||this.x>w) this.speedX *= -1;
        if(this.y<0||this.y>h) this.speedY *= -1;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle="#72b8ff";
        ctx.fill();
    }
}
for(let i=0;i<60;i++) dots.push(new Dot());
function line(){
    for(let i=0;i<dots.length;i++){
        for(let j=i+1;j<dots.length;j++){
            let dx = dots[i].x - dots[j].x;
            let dy = dots[i].y - dots[j].y;
            let d = Math.sqrt(dx*dx+dy*dy);
            if(d<100){
                ctx.beginPath();
                ctx.moveTo(dots[i].x,dots[i].y);
                ctx.lineTo(dots[j].x,dots[j].y);
                ctx.strokeStyle="rgba(114,184,255,"+(1-d/100)+")";
                ctx.lineWidth=0.6;
                ctx.stroke();
            }
        }
    }
}
function animate(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{d.update();d.draw();});
    line();
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
